version: "3.8"

services:
  # PostgreSQL (opcional — para produção com escala)
  postgres:
    image: postgres:16-alpine
    container_name: radar-postgres
    environment:
      POSTGRES_DB: radar_licitacoes
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radar_secret_change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - radar-net
    profiles:
      - postgres

  # Dashboard Streamlit
  dashboard:
    build: .
    container_name: radar-dashboard
    volumes:
      - ./dados:/app/dados
      - ./config:/app/config
      - ./.env:/app/.env:ro
    restart: unless-stopped
    environment:
      - TZ=America/Sao_Paulo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - radar-net

  # API REST FastAPI
  api:
    build: .
    container_name: radar-api
    entrypoint: ["python", "-m", "uvicorn", "api_rest:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./dados:/app/dados
      - ./.env:/app/.env:ro
    restart: unless-stopped
    environment:
      - TZ=America/Sao_Paulo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - radar-net

  # Nginx reverse proxy com HTTPS
  nginx:
    image: nginx:alpine
    container_name: radar-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - dashboard
      - api
    restart: unless-stopped
    networks:
      - radar-net

  # Agendador de tarefas (APScheduler)
  scheduler:
    build: .
    container_name: radar-scheduler
    entrypoint: ["python", "run_scheduler.py"]
    volumes:
      - ./dados:/app/dados
      - ./config:/app/config
      - ./.env:/app/.env:ro
    restart: unless-stopped
    environment:
      - TZ=America/Sao_Paulo
    networks:
      - radar-net

networks:
  radar-net:
    driver: bridge

volumes:
  pgdata:
